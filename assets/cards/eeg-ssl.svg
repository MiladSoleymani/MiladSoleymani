<svg xmlns="http://www.w3.org/2000/svg" width="500" height="168" viewBox="0 0 500 168" role="img" aria-label="Self-supervised EEG Embedding">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0D1424"/><stop offset="100%" stop-color="#15243D"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4FD6BE"/><stop offset="100%" stop-color="#4FD6BE" stop-opacity="0.25"/>
  </linearGradient>
  <clipPath id="card"><rect width="500" height="168" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="500" height="168" fill="url(#bg)"/>
<rect x="0" y="0" width="5" height="168" fill="url(#accent)"/>
<circle cx="470" cy="26" r="86" fill="#4FD6BE" fill-opacity="0.07"/>
<text x="30" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#EAF2FF" textLength="325" lengthAdjust="spacingAndGlyphs">Self-supervised EEG Embedding</text>
<text x="30" y="84" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#93A8C4">Label-free EEG representations that transfer</text>
<text x="30" y="105" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#93A8C4">across BCI IV-2a, LEE and CHB-MIT.</text>
<rect x="30" y="120" width="95" height="24" rx="12" fill="#152743" stroke="#263C5E" stroke-width="1"/><circle cx="44" cy="132" r="3.6" fill="#792EE5"/><text x="54" y="136.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#AFC1D9" textLength="61" lengthAdjust="spacing">Lightning</text>
<rect x="135" y="120" width="53" height="24" rx="12" fill="#152743" stroke="#263C5E" stroke-width="1"/><circle cx="149" cy="132" r="3.6" fill="#4FD6BE"/><text x="159" y="136.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#AFC1D9" textLength="19" lengthAdjust="spacing">SSL</text>
