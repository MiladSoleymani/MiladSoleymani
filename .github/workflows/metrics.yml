name: Metrics

on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Overview panel: profile header, activity, community stats, full-year commit calendar
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tehran
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Coding habits: time-of-day and weekday charts
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.habits.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph

      # Language breakdown, measured by cloning repositories rather than guessing from events
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming
          plugin_languages_limit: 6
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: >-
            html, css, scss, tex, jupyter notebook

      # GitHub achievements plus most-used repository topics
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.achievements.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
