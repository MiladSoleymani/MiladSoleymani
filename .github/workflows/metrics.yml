name: Metrics

on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Overview panel: profile header, activity, community stats, full-year commit calendar
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tehran
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Language breakdown, measured by cloning repositories rather than guessing from events
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming
          plugin_languages_limit: 6
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: >-
            html, css, scss, tex, jupyter notebook

      # Lines of code changed across repositories
      - name: Lines
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.lines.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 6

      # Repository topics, rendered as icons
      - name: Topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MiladSoleymani
          filename: metrics.topics.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
